<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hackerspace: Terminal Escape — DEMO</title>
<style>
  /* ============================================================
     RETRO CYBERPUNK TERMINAL STİLİ
     ============================================================ */
  :root{
    --bg:#0a0a0a;
    --neon:#00ff66;
    --red:#ff3366;
    --cyan:#00e5ff;
    --amber:#ffb02a;
    --purple:#c44dff;
    --mono:'Courier New',Courier,monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:100%; height:100%; overflow:hidden;
    background:var(--bg);
    font-family:var(--mono);
    color:var(--neon);
    -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
  }

  #game-wrap{ position:fixed; inset:0; }

  canvas#game{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    background:var(--bg);
    touch-action:none;
  }

  /* ---------- CRT SCANLINE + VİNYET EFEKTİ (saf CSS, resim yok) ---------- */
  .crt{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:
      repeating-linear-gradient(0deg,
        rgba(0,0,0,0.28) 0px, rgba(0,0,0,0.28) 1px,
        transparent 1px, transparent 3px);
  }
  .crt::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- ANA ÜST BİNME (OVERLAY) EKRANLARI ---------- */
  .overlay{
    position:absolute; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:26px; padding:28px;
    background:rgba(4,4,4,0.86);
    overflow-y:auto;
  }
  .overlay[hidden]{ display:none; }

  .panel{
    border:2px solid var(--neon);
    box-shadow:0 0 18px rgba(0,255,102,0.35), inset 0 0 24px rgba(0,255,102,0.08);
    padding:38px 48px;
    max-width:min(92vw,660px);
    max-height:94vh; overflow-y:auto;
    background:rgba(6,10,8,0.92);
  }
  .shop-panel{ max-width:min(94vw,880px); }

  h1{
    font-size:clamp(22px,5.4vw,44px);
    font-weight:bold; letter-spacing:4px; white-space:nowrap;
    color:var(--neon);
    text-shadow:0 0 10px var(--neon), 0 0 30px var(--neon);
  }
  h1 .blink{ animation:blink 1s steps(2) infinite; }
  @keyframes blink{ 50%{opacity:0;} }

  h2{
    font-size:clamp(24px,6vw,42px); letter-spacing:3px;
    color:var(--red);
    text-shadow:0 0 12px var(--red), 0 0 34px var(--red);
    animation:alertPulse 0.9s steps(2) infinite;
  }
  @keyframes alertPulse{ 50%{opacity:0.55;} }

  .sub{ font-size:clamp(12px,2.4vw,15px); color:var(--cyan); opacity:0.9; letter-spacing:1px; }

  .keys{
    font-size:clamp(12px,2.6vw,15px); line-height:2.3; color:var(--neon);
    text-align:left; display:inline-block;
  }
  .keys b{
    color:#041008; background:var(--neon); padding:2px 10px; margin-right:6px;
    border-radius:2px; box-shadow:0 0 8px rgba(0,255,102,0.6);
    letter-spacing:1px;
  }
  .sw{ text-shadow:0 0 8px currentColor; }

  .btn{
    font-family:var(--mono); font-size:clamp(13px,2.8vw,17px); font-weight:bold;
    letter-spacing:2px; cursor:pointer;
    color:var(--neon); background:rgba(0,255,102,0.06);
    border:2px solid var(--neon);
    padding:14px 36px;
    margin:6px 8px;
    box-shadow:0 0 12px rgba(0,255,102,0.35);
    text-transform:uppercase;
    transition:background-color 0.05s linear, color 0.05s linear, box-shadow 0.05s linear;
    will-change:background-color,color;
  }
  .btn:hover,.btn:active{
    background:var(--neon); color:#041008;
    box-shadow:0 0 26px rgba(0,255,102,0.9);
  }
  .btn.ghost{
    color:var(--cyan); border-color:var(--cyan);
    background:rgba(0,229,255,0.05);
    box-shadow:0 0 12px rgba(0,229,255,0.3);
  }
  .btn.ghost:hover,.btn.ghost:active{ background:var(--cyan); color:#02141f; box-shadow:0 0 26px rgba(0,229,255,0.9); }
  .btn.mini{ font-size:clamp(11px,2.2vw,13px); padding:10px 18px; letter-spacing:1px; }

  .hiscore{
    font-size:clamp(12px,2.4vw,15px); color:var(--amber);
    text-shadow:0 0 8px rgba(255,176,42,0.6);
    letter-spacing:1px;
  }

  .status{ font-size:clamp(13px,2.6vw,16px); letter-spacing:1px; }

  .sector-progress-wrap{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; margin-top:2px; }
  .sector-progress-label{
    font-size:clamp(9px,1.8vw,11px); color:var(--cyan); opacity:0.75;
    letter-spacing:2px;
  }
  .sector-progress{ display:flex; gap:3px; width:100%; max-width:320px; }
  .sector-progress .seg{
    flex:1; min-width:6px; height:8px;
    border:1px solid rgba(255,176,42,0.55);
    opacity:0.22;
  }
  .sector-progress .seg.on{
    background:var(--amber); opacity:1;
    box-shadow:0 0 8px rgba(255,176,42,0.7);
  }
  .sector-progress .seg.cur{
    background:rgba(255,176,42,0.4); opacity:0.85;
  }

  .row{ display:flex; gap:24px; flex-wrap:wrap; justify-content:center; align-items:center; margin:6px 0; }
  .footer-row{ display:flex; gap:28px; flex-wrap:wrap; justify-content:center; align-items:center; margin-top:12px; }

  /* ---------- AYARLAR (KÖŞE BUTONU) ---------- */
  .corner-btn{
    position:absolute; top:16px; right:16px; z-index:130;
    font-family:var(--mono); font-size:clamp(11px,2vw,13px); font-weight:bold;
    letter-spacing:1px; cursor:pointer;
    color:var(--amber); background:rgba(255,176,42,0.07);
    border:1px solid var(--amber); padding:8px 14px;
    opacity:0.75;
    transition:background-color 0.05s linear, color 0.05s linear, box-shadow 0.05s linear;
    will-change:background-color,color;
  }
  .corner-btn:hover,.corner-btn:active{
    opacity:1; background:var(--amber); color:#141002;
    box-shadow:0 0 14px rgba(255,176,42,0.8);
  }
  .corner-btn[hidden]{ display:none; }

  /* ---------- MOBİL EĞİL BUTONU ---------- */
  .duck-btn{
    position:absolute; left:20px; bottom:26px; z-index:90;
    width:86px; height:86px; border-radius:50%;
    font-family:var(--mono); font-size:clamp(12px,3.4vw,15px); font-weight:bold;
    letter-spacing:2px; cursor:pointer;
    color:var(--cyan); background:rgba(0,229,255,0.08);
    border:2px solid var(--cyan); padding:0;
    box-shadow:0 0 16px rgba(0,229,255,0.4);
    opacity:0.85;
    touch-action:none;
    transition:background-color 0.05s linear, color 0.05s linear;
  }
  .duck-btn:active{
    background:var(--cyan); color:#02141f;
    box-shadow:0 0 26px rgba(0,229,255,0.9);
  }
  .duck-btn[hidden]{ display:none; }

  /* ---------- AYARLAR EKRANI ---------- */
  .set-block{ display:flex; flex-direction:column; align-items:center; gap:12px; margin:8px 0 4px; }
  .set-label{
    font-size:clamp(12px,2.4vw,14px); color:var(--cyan);
    letter-spacing:2px; opacity:0.9;
  }
  .set-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .lang-opt{
    font-family:var(--mono); font-size:12px; font-weight:bold; letter-spacing:2px;
    cursor:pointer; color:var(--cyan);
    background:rgba(0,229,255,0.06);
    border:2px solid var(--cyan); padding:8px 24px;
    opacity:0.6; transition:background-color 0.05s linear, color 0.05s linear;
  }
  .lang-opt.active{ opacity:1; background:var(--cyan); color:#02141f; box-shadow:0 0 14px rgba(0,229,255,0.7); }
  .lang-opt:hover{ opacity:1; }

  /* ---------- SKİN MAĞAZASI ---------- */
  .preview-row{
    display:flex; gap:26px; align-items:center; justify-content:center;
    margin:10px 0 6px;
  }
  #preview-canvas{
    width:150px; height:130px;
    border:1px solid rgba(0,255,102,0.45);
    box-shadow:0 0 14px rgba(0,255,102,0.35);
    background:rgba(0,255,102,0.05);
  }
  .preview-info{ display:flex; flex-direction:column; gap:10px; text-align:left; }

  .shop-balance{
    font-size:clamp(13px,2.6vw,17px); color:var(--amber);
    letter-spacing:2px; margin:10px 0 4px;
    text-shadow:0 0 10px rgba(255,176,42,0.5);
  }
  .chip-row{ display:flex; gap:14px; justify-content:center; margin:10px 0 16px; }
  .chip{
    font-family:var(--mono); font-size:12px; font-weight:bold; letter-spacing:2px;
    cursor:pointer; color:var(--cyan);
    background:rgba(0,229,255,0.06);
    border:2px solid var(--cyan); padding:8px 24px;
    opacity:0.6; transition:background-color 0.05s linear, color 0.05s linear;
  }
  .chip.active{ opacity:1; background:var(--cyan); color:#02141f; box-shadow:0 0 14px rgba(0,229,255,0.7); }
  .chip:hover{ opacity:1; }

  .shop-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(118px,1fr));
    gap:16px;
    max-height:50vh; overflow-y:auto;
    padding:10px 4px;
    margin-bottom:8px;
  }
  .skin-card{
    font-family:var(--mono); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 8px;
    color:var(--neon); background:rgba(0,255,102,0.04);
    border:2px solid rgba(0,255,102,0.35);
    transition:border-color 0.05s linear, background-color 0.05s linear;
  }
  .skin-card:hover{ border-color:var(--neon); }
  .skin-card.active{ border-color:var(--neon); box-shadow:0 0 16px rgba(0,255,102,0.55); background:rgba(0,255,102,0.10); }
  .skin-card canvas{ width:96px; height:104px; background:rgba(0,0,0,0.45); }
  .skin-card .sname{ font-size:12px; font-weight:bold; letter-spacing:1px; text-align:center; }
  .skin-card .sstat{ font-size:10px; color:var(--amber); letter-spacing:1px; min-height:14px; }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>
  <div class="crt"></div>

  <!-- ==================== AYARLAR KÖŞE BUTONU ==================== -->
  <button id="btn-settings" class="corner-btn" data-i18n="settings"></button>

  <!-- ==================== MOBİL EĞİL BUTONU (sol taraf) ==================== -->
  <button id="btn-duck" class="duck-btn" data-i18n="duckBtn" hidden></button>

  <!-- ==================== BAŞLANGIÇ EKRANI ==================== -->
  <div id="screen-menu" class="overlay">
    <div class="panel">
      <h1>TERMINAL_ESCAPE<span class="blink">.EXE</span></h1>
      <div class="sub" data-i18n="subtitle"></div>
      <div class="sub" id="demo-note" data-i18n="demoSub" hidden style="color:var(--amber)"></div>
      <div class="keys">
        <div><b>[SPACE] / [&#8593;]</b> — <span data-i18n="ctrlJump"></span></div>
        <div><b>[P]</b> — <span data-i18n="ctrlPause"></span></div>
        <div><b>[SHIFT]</b> — <span data-i18n="ctrlDuck"></span></div>
        <div><b>[TOUCH]</b> — <span data-i18n="ctrlTouch"></span></div>
        <div style="height:6px"></div>
        <div><span data-i18n="legend"></span></div>
        <div>
          <span class="sw" style="color:var(--neon)">&#9670;</span> <span data-i18n="legShield"></span>&nbsp;&nbsp;
          <span class="sw" style="color:var(--amber)">x2</span> <span data-i18n="legMult"></span>&nbsp;&nbsp;
          <span class="sw" style="color:var(--red)">&#10024;</span> <span data-i18n="legNear"></span>&nbsp;&nbsp;
          <span class="sw" style="color:var(--cyan)">&#9830;</span> <span data-i18n="legBits"></span>
        </div>
      </div>

      <div class="preview-row">
        <canvas id="preview-canvas" width="300" height="260"></canvas>
        <div class="preview-info">
          <div class="status" id="menu-skin"></div>
          <div class="hiscore" id="menu-high"></div>
          <div class="hiscore" id="menu-total"></div>
          <div class="sector-progress-wrap">
            <div class="sector-progress-label" data-i18n="sectorProgress"></div>
            <div class="sector-progress" id="menu-progress"></div>
          </div>
        </div>
      </div>

      <div class="row">
        <button class="btn" id="btn-start" data-i18n="start"></button>
        <button class="btn ghost" id="btn-shop" data-i18n="shopButton"></button>
      </div>
    </div>
  </div>

  <!-- ==================== DURAKLATMA EKRANI ==================== -->
  <div id="screen-pause" class="overlay" hidden>
    <div class="panel">
      <h1 style="color:var(--cyan);text-shadow:0 0 10px var(--cyan),0 0 30px var(--cyan);" data-i18n="pauseTitle"></h1>
      <div class="row">
        <button class="btn" id="btn-resume" data-i18n="resume"></button>
        <button class="btn ghost" id="btn-quit" data-i18n="quit"></button>
      </div>
    </div>
  </div>

  <!-- ==================== OYUN SONU EKRANI ==================== -->
  <div id="screen-over" class="overlay" hidden>
    <div class="panel">
      <h2 data-i18n="overTitle"></h2>
      <div class="status" data-i18n="overSub"></div>
      <div class="sub"><span data-i18n="overScoreLabel"></span> <span id="over-score">0</span> KB</div>
      <div class="sub"><span data-i18n="hudLevel"></span>: <span id="over-lvl">0</span></div>
      <div class="sub"><span data-i18n="hudSector"></span>: <span id="over-sec">0</span></div>
      <div class="hiscore"><span data-i18n="highScore"></span>: <span id="over-high">0</span> KB</div>
      <div class="row">
        <button class="btn" id="btn-retry" data-i18n="retry"></button>
        <button class="btn ghost" id="btn-menu" data-i18n="menuBtn"></button>
      </div>
    </div>
  </div>

  <!-- ==================== DEMO BİTİŞ EKRANI ==================== -->
  <div id="screen-demo" class="overlay" hidden>
    <div class="panel">
      <h2 data-i18n="demoTitle"></h2>
      <div class="status" data-i18n="demoNote"></div>
      <div class="sub"><span data-i18n="overScoreLabel"></span> <span id="demo-score">0</span> KB</div>
      <div class="hiscore"><span data-i18n="highScore"></span>: <span id="demo-high">0</span> KB</div>
      <div class="row">
        <button class="btn" id="btn-demo-retry" data-i18n="retry"></button>
        <button class="btn ghost" id="btn-demo-menu" data-i18n="menuBtn"></button>
      </div>
    </div>
  </div>

  <!-- ==================== SKİN MAĞAZASI EKRANI ==================== -->
  <div id="screen-shop" class="overlay" hidden>
    <div class="panel shop-panel">
      <h1 style="color:var(--cyan);text-shadow:0 0 10px var(--cyan),0 0 30px var(--cyan);" data-i18n="shopTitle"></h1>
      <div class="shop-balance" id="shop-balance"></div>
      <div class="chip-row">
        <button class="chip active" data-filter="all" data-i18n="filterAll"></button>
        <button class="chip" data-filter="hats" data-i18n="filterHats"></button>
      </div>
      <div class="shop-grid" id="shop-grid"></div>
      <button class="btn ghost" id="btn-shop-back" data-i18n="shopBack"></button>
    </div>
  </div>

  <!-- ==================== AYARLAR EKRANI ==================== -->
  <div id="screen-settings" class="overlay" hidden>
    <div class="panel">
      <h1 style="color:var(--amber);text-shadow:0 0 10px var(--amber),0 0 30px var(--amber);" data-i18n="settingsTitle"></h1>
      <div class="set-block">
        <div class="set-label" data-i18n="setLang"></div>
        <div class="set-row">
          <button class="lang-opt" data-lang="en">EN</button>
          <button class="lang-opt" data-lang="de">DE</button>
          <button class="lang-opt" data-lang="tr">TR</button>
        </div>
      </div>
      <div class="set-block">
        <div class="set-label" data-i18n="setSound"></div>
        <button class="btn mini" id="btn-set-mute"></button>
      </div>
      <div class="set-block">
        <div class="set-label" data-i18n="setGlow"></div>
        <button class="btn mini" id="btn-set-glow"></button>
      </div>
      <div class="row">
        <button class="btn ghost" id="btn-settings-back" data-i18n="settingsBack"></button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
/* DEMO MODU: true yapılırsa yalnızca ilk 3 sektör oynanır, mağaza kilitlenir
   ve 3. sektör bitince "DEMO BİTTİ" ekranı çıkar. (demo.html bu bayrakla üretilir) */
const DEMO = true;
/* ============================================================================
   HACKERSPACE: TERMINAL ESCAPE  v4.1
   Tek dosyalık 2D Endless Runner - Canvas API + Vanilla JS
   - Harici görsel/ses dosyası yok (grafikler prosedürel, sesler WebAudio)
   - Çoklu dil: EN / DE / TR
   - BGM (retro synth arpeggio) + sessize alma
   - 20 TEMALI SEKTÖR: her sektör farklı renk + engel karışımı + zorluk
     (ground / laser / flyer / spike / saw / pit), tier döngüsü ile sertleşir
   - NEAR MISS kombo sistemi (x1.5 -> x5 zincirli çarpan)
   - VERİ BİTİ toplama öğeleri (düşük, tek zıplamayla ulaşılır yaylar)
   - x2 çarpan: daha erişilebilir yükseklik + mıknatıs çekimi + pit güvenliği
   - EĞİLME: masaüstünde SHIFT basılı tutunca %50 küçülme / mobilde sol eğil butonu
   - Glow aç/kapa (düşük cihazlar) + ekran sarsıntısı
   - 64 skín (8 renk x 8 şapka) + ayrı skín mağazası ekranı
   - Her 100 puanda hızlanma, yavaş başlangıç, sert zorluk eğrisi
   ============================================================================ */

/* ------------------------ SABİTLER ------------------------ */
const STATE = { MENU: 0, PLAY: 1, PAUSE: 2, OVER: 3, TRANS: 4 };

const COLORS = {
  bg:    '#0a0a0a',
  neon:  '#00ff66',
  red:   '#ff3366',
  cyan:  '#00e5ff',
  amber: '#ffb02a',
  purple:'#c44dff'
};

/* ------------------------ SEVİYELER / TEMALAR ------------------------
   Her sektör: farklı renk teması, engel karışımı ve zorluk parametreleri.
   run.sector her SECTOR_LEN puanın sonunda 1 artar; 20 sektörden sonra
   aynı temalar daha sert parametrelerle döngüye girer (tier).            */
const SECTOR_LEN = 300;
const LEVELS = [
  { accent:'#00ff66', bg:'#042d15',
    w:{ground:100, laser:55, flyer:0,  spike:0,  saw:0,  pit:0},
    density:1.00, laserGap:1.55, flyerSize:0.90, base:0.34, max:3.6,
    nameKey:'sec1', tipKey:'tip1' },
  { accent:'#ff3355', bg:'#2d0c12',
    w:{ground:20, laser:0, flyer:35, spike:70, saw:55, pit:0},
    density:1.12, laserGap:1.55, flyerSize:0.85, base:0.40, max:4.0,
    nameKey:'sec2', tipKey:'tip2' },
  { accent:'#00e5ff', bg:'#04292d',
    w:{ground:40, laser:100, flyer:30, spike:0,  saw:0,  pit:0},
    density:1.20, laserGap:1.45, flyerSize:0.90, base:0.46, max:4.4,
    nameKey:'sec3', tipKey:'tip3' },
  { accent:'#c44dff', bg:'#24112d',
    w:{ground:30, laser:0, flyer:35, spike:0,  saw:0,  pit:70},
    density:1.25, laserGap:1.55, flyerSize:0.95, base:0.52, max:4.8,
    nameKey:'sec4', tipKey:'tip4' },
  { accent:'#ffb02a', bg:'#2d200b',
    w:{ground:55, laser:45, flyer:45, spike:40, saw:35, pit:30},
    density:1.35, laserGap:1.45, flyerSize:1.00, base:0.58, max:5.2,
    nameKey:'sec5', tipKey:'tip5' },
  { accent:'#ff5ad1', bg:'#2d1326',
    w:{ground:25, laser:30, flyer:100, spike:20, saw:0,  pit:0},
    density:1.18, laserGap:1.50, flyerSize:1.05, base:0.42, max:4.2,
    nameKey:'sec6', tipKey:'tip6' },
  { accent:'#4d9bff', bg:'#111d2d',
    w:{ground:60, laser:0, flyer:0,  spike:0,  saw:100, pit:0},
    density:1.22, laserGap:1.50, flyerSize:0.90, base:0.48, max:4.6,
    nameKey:'sec7', tipKey:'tip7' },
  { accent:'#b7ff2a', bg:'#212d0b',
    w:{ground:20, laser:0, flyer:20, spike:80, saw:0,  pit:60},
    density:1.24, laserGap:1.55, flyerSize:0.90, base:0.50, max:4.7,
    nameKey:'sec8', tipKey:'tip8' },
  { accent:'#ff8c2a', bg:'#2d1b0b',
    w:{ground:30, laser:70, flyer:0,  spike:60, saw:0,  pit:0},
    density:1.26, laserGap:1.42, flyerSize:0.90, base:0.52, max:4.8,
    nameKey:'sec9', tipKey:'tip9' },
  { accent:'#2affd5', bg:'#0b2d26',
    w:{ground:25, laser:60, flyer:80, spike:0,  saw:0,  pit:0},

function sectorBase(idx) {
  const L = LEVELS[idx % LEVELS.length];
  const tier = Math.floor(idx / LEVELS.length);
  return clamp(W * (L.base + tier * 0.05), 160, 440);
}
function sectorMax(idx, base) {
  const L = LEVELS[idx % LEVELS.length];
  const tier = Math.floor(idx / LEVELS.length);
  return base * (L.max + tier * 0.4);
}

/* ------------------------ localStorage yardımcıları ------------------------ */
function loadStr(key, def) {
  try { const v = localStorage.getItem(key); return v === null ? def : v; } catch (e) { return def; }
}
function saveStr(key, v) {
  try { localStorage.setItem(key, v); } catch (e) {}
}
function loadInt(key, def) {
  return parseInt(loadStr(key, String(def))) || def;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
function alphaColor(hex, a) {
  const r = hexToRgb(hex);
  return 'rgba(' + r[0] + ',' + r[1] + ',' + r[2] + ',' + a + ')';
}

/* ------------------------ SKİN DURUMU ------------------------ */
let totalKB = loadInt(KEYS.total, 0);
let currentSkin = loadStr(KEYS.skin, 'green');
let shopFilter = 'all';

function ownedSkins() {
  try { return JSON.parse(loadStr(KEYS.skins, '["green"]')); } catch (e) { return ['green']; }
}
function saveOwned(list) { saveStr(KEYS.skins, JSON.stringify(list)); }
function addOwned(key) {
  const o = ownedSkins();
  if (o.indexOf(key) === -1) { o.push(key); saveOwned(o); }
}
function currentSkinObj() {
  return SKINS.filter(x => x.key === currentSkin)[0] || SKINS[0];
}
function skinColor() { return currentSkinObj().color; }
function skinHat()    { return currentSkinObj().hat; }
function skinName(s) {
  const c = t('skin_' + s.colorKey);
  if (s.hat === 'none') return c;
  return c + ' ' + t('hat_' + s.hat);
}

/* shadowBlur kesici: glowOn kapalıyken tüm canvas glow efektlerini 0'lar.
   Böylece drawGlow / drawPlayer / drawHUD vb. hiçbir koda dokunmadan
   düşük sistemlerde shadow hesaplaması tamamen devre dışı kalır.
   Gerçek canvas durumunu güncellemek için native setter da çağrılır. */
let __glowBlur = 0;
try {
  const nativeSet = Object.getOwnPropertyDescriptor(
    Object.getPrototypeOf(ctx), 'shadowBlur').set;
  Object.defineProperty(ctx, 'shadowBlur', {
    configurable: true,
    get: () => __glowBlur,
    set: (v) => {
      __glowBlur = glowOn ? v : 0;
      if (nativeSet) nativeSet.call(ctx, __glowBlur);
    }
  });
} catch (e) {}
ctx.shadowBlur = 0;

/* ------------------------ OYUN ALANI / BOYUT ------------------------ */
let W = 0, H = 0, DPR = 1;
let groundY = 0;        // zemin çizgisi (mantıksal px)
let pSize   = 44;       // oyuncu boyutu
let gravity = 2600;     // yerçekimi px/s²
let jumpV   = 0;        // zıplama hızı (yeniden hesaplanır)
let dJumpV  = 0;        // çift zıplama hızı
let maxObH  = 0;        // atlanabilir maksimum engel yüksekliği

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* Fizik, ekran yüksekliğine göre ölçeklenir -> tüm cihazlarda aynı his */
  groundY = H * 0.82;
  pSize   = Math.max(26, Math.round(H * 0.055));
  const apexT  = 0.50;                       // zıplama tepe süresi (s)
  const jumpH  = H * 0.40;                   // tek zıplama yüksekliği
  gravity = 2 * jumpH / (apexT * apexT);     // 2h/t²
  jumpV   = gravity * apexT;                 // v = g*t
  dJumpV  = jumpV * 0.88;                    // ikinci zıplama biraz zayıf
  maxObH  = jumpH * 0.85;                    // en yüksek atlanabilir firewall

  if (player.y > groundY - pSize) {          // resize sırasında zemine sabitle
    player.y = groundY - pSize;
    player.vy = 0;
  }
  player.x = W * 0.16;
}

/* ------------------------ OYUNCU ------------------------ */
const player = {
  x: 0, y: 0, w: pSize, h: pSize,
  vy: 0,
  jumps: 0,          // kullanılan zıplama sayısı (0,1,2)
  grounded: false,
  coyote: 0,         // coyote zamanı (kenardan düşerken kısa süre zıplayabilme)
  buffer: 0,         // zıplama tamponu (tuşa erken basılınca)
  landT: 0           // iniş squash süresi
};

/* ------------------------ OYUN ÇALIŞMA DEĞİŞKENLERİ ------------------------ */
let state = STATE.MENU;
let lastT = 0;
let run = {};            // her turda resetlenir
let obstacles = [];
let powerups  = [];
let bits      = [];      // veri bitleri (küçük skor toplama öğeleri)
let particles = [];
let popups    = [];
let trail     = [];
let shake = 0;           // çarpma ekran sarsıntısı
let flash = 0;           // çarpma kırmızı flaş

function resetRun() {
  obstacles = [];
  powerups  = [];
  bits      = [];
  particles = [];
  popups    = [];
  trail     = [];
  run = {
    time: 0,             // tur süresi (s)
    speed: 0,            // güncel hız (px/s)
    base:  0,            // başlangıç hızı (yavaş başlangıç)
    max:   0,            // maksimum hız
    level: 0,            // her 100 puanda artar
    sector: 0,           // güncel sektör (0..4, sonra tier döngüsü)
    lastSector: -1,      // önceki sektör (geçiş tespiti)
    ACC: 0,              // zamana bağlı hızlanma katsayısı (px/s²)
    SECTOR_DEC: 0,       // yeni sektöre geçişte kısa yavaşlama rampası
    banUntil: 0,         // sektör geçişinden sonra engel üretim yasağı (px mesafe)
    dist:  0,            // işlenen veri (KB taban puan)
    mult:  false, multT: 0,
    shield:false, shieldT: 0,
    nearT: 0,            // NEAR MISS geçici çarpanı
    combo: 0,            // NEAR MISS kombo zinciri (çarpan artar)
    duck:  false,        // eğilme / küçülme (%50 boyut)
    nextObstacle: 0,     // sonraki engel mesafesi (px)
    nextPower: 0,        // sonraki güçlendirme mesafesi
    scroll: 0            // arka plan kaydırma
  };
  applyTheme(0);
  run.base = sectorBase(0);
  run.max  = sectorMax(0, run.base);
  run.ACC  = 2 + run.sector * 0.8;
  run.SECTOR_DEC = 0;
  run.banUntil = 0;
  run.speed = run.base;
  run.nextObstacle = W * 0.85;
  run.nextPower    = W * (2.6 + Math.random() * 1.4);   // çarpan daha sık + ulaşılabilir
  run.nextBits     = W * 1.0;
  player.y = groundY - pSize;
  player.vy = 0; player.jumps = 0;
  player.grounded = true;
  player.coyote = 0; player.buffer = 0; player.landT = 0;
}

/* ------------------------ EĞİLME / KÜÇÜLME ------------------------ */
/* Eğilme aktifken oyuncu etkin boyutu %50 olur (collision + çizim + trail). */
function effSize() { return pSize * (run.duck ? 0.5 : 1); }
function setDuck(v) {
  if (!run || run.duck === v) return;
  const oldS = pSize * (run.duck ? 0.5 : 1);
  run.duck = v;
  const newS = pSize * (run.duck ? 0.5 : 1);
  if (player.grounded) {                       // ayaklar yerde kalır, gövde iner/kalkar
    player.y += (oldS - newS);
    if (player.y + newS > groundY) player.y = groundY - newS;
  }
  if (player.y < 0) player.y = 0;
  if (v) beep(220, 0.05, 0.04, 'square');      // eğilme "tıklama" sesi
}

/* ------------------------ NEAR MISS ÇARPAN ------------------------ */
/* Ardışık yakın geçişler kombo yapar: x1.5 -> x2 -> x2.5 ... x5 (combo 7'de). */
function nearFactor() { return 1.5 + Math.min(run.combo, 7) * 0.5; }

/* ------------------------ YÜKSEK SKOR ------------------------ */
function loadHigh() { return loadInt(KEYS.high, 0); }
function saveHigh(v) { saveStr(KEYS.high, String(v)); }

/* ------------------------ SES (WebAudio, harici dosya yok) ------------------------ */
let actx = null;
let noiseBuf = null;

function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (actx) {
    if (actx.state === 'suspended') {
      const p = actx.resume();
      if (p && p.then) p.then(() => {});
    }
    bgmStart();
  }
  return actx;
}
/* beep: "at" mutlak zaman (s), verilmezse hemen çalar */
function beep(freq, dur, vol, type, at) {
  const a = audio(); if (!a || a.state !== 'running') return;
  const t0 = at || a.currentTime;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function note(midi, at, dur, vol, type) {
  beep(440 * Math.pow(2, (midi - 69) / 12), dur, vol, type || 'square', at);
}
function hat(at) {
  const a = audio(); if (!a || a.state !== 'running') return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.05), a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  }
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const g = a.createGain();
  g.gain.setValueAtTime(0.05, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.04);
  s.connect(g).connect(a.destination);
  s.start(at);
}

/* BGM: 16'lık step sekanslayıcı, retro synth arpeggio + bas + hi-hat */
const BPM  = 138;
const STEP = 60 / BPM / 4;              // 16'lık nota süresi
const ROOT = 45;                        // A2 (bas kökü)
const ARP  = [0,3,7,12,3,7,12,7, 0,3,7,12,10,7,3,7]; // arpej (yarım ton ofsetleri)
let bgmOn = false, bgmTimer = null, stepIdx = 0, nextStep = 0;

function bgmStart() {
  if (!actx || bgmOn) return;
  bgmOn = true;
  stepIdx = 0;
  nextStep = actx.currentTime + 0.08;
  bgmTimer = setInterval(bgmTick, 25);
}
function bgmStop() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  bgmOn = false;
}
function bgmTick() {
  if (!actx) return;
  if (muted) { nextStep = actx.currentTime + 0.08; return; }   // sessizken zamanı sıfırla
  if (actx.state !== 'running') return;                        // henüz başlamadıysa bekle
  if (nextStep < actx.currentTime) nextStep = actx.currentTime + 0.08;
  let guard = 0;
  while (nextStep < actx.currentTime + 0.12 && guard < 8) {    // sesi ~0.12s önceden planla
    const s = stepIdx % 16;
    note(ROOT + ARP[s], nextStep, STEP * 0.9, 0.045, 'square');
    if (s % 4 === 0) note(ROOT - 12, nextStep, STEP * 3.4, 0.07, 'triangle'); // bas
    if (s % 2 === 1) hat(nextStep);                                              // hat
    nextStep += STEP;
    stepIdx++;
    guard++;
  }
}

const sfx = {
  jump:    () => beep(420, 0.09, 0.08, 'square'),
  double:  () => beep(640, 0.09, 0.08, 'square'),
  pickup:  () => { beep(880, 0.07, 0.09, 'square'); beep(1320, 0.10, 0.09, 'square', 0.06); },
  near:    () => { beep(1100, 0.06, 0.07, 'square'); beep(1560, 0.08, 0.06, 'square', 0.05); },
  hit:     () => { beep(160, 0.28, 0.14, 'sawtooth'); beep(90, 0.35, 0.12, 'square', 0.05); },
  over:    () => { beep(300, 0.4, 0.10, 'sawtooth'); beep(180, 0.6, 0.10, 'sawtooth', 0.25); }
};

function toggleMute() {
  muted = !muted;
  saveStr(KEYS.mute, muted ? '1' : '0');
  updateMuteLabel();
}

/* Glow performans anahtarı: canvas shadowBlur/shadowColor efektlerini açar/kapatır */

/* ------------------------ ZIPLAMA ------------------------ */
function jump() {
  if (player.grounded || player.coyote > 0) {
    player.buffer = 0.12;                // yerdeyken: iniş tamponu
  } else if (player.vy > 0 && (groundY - effSize() - player.y) < 40) {
    player.buffer = 0.12;                // inmeye çok yakın: inişte otomatik zıpla
  } else {
    tryJump();                           // havadayken basış: anında çift zıplama
  }
}
function tryJump() {
  const canAir = player.jumps < 2;         // çift zıplama hakkı
  if (!canAir) return;
  player.jumps++;
  if (player.jumps === 1) {
    player.vy = -jumpV;                    // tek zıplama
    sfx.jump();
  } else {
    player.vy = -dJumpV;                   // çift zıplama
    sfx.double();
  }
  player.grounded = false;
  player.coyote = 0;
  spawnTrail(player.x + effSize() / 2, player.y + effSize());
}
function canGroundJump() {
  return player.jumps === 0 || player.coyote > 0;
}

/* ------------------------ PARÇACIKLAR / POPUP ------------------------ */
function spawnTrail(x, y) {
  particles.push({ x: x, y: y, vx: (Math.random()-0.5)*40, vy: -60, life: 0.35, max: 0.35, color: skinColor(), size: 3 });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 90 + Math.random() * 220;
    particles.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5, max: 0.5, color: color, size: 3 });
  }
}

/* ------------------------ NEAR MISS ------------------------ */
function triggerNearMiss(o) {
  run.combo = (run.nearT > 0) ? Math.min(run.combo + 1, 7) : 0;  // zincir kombo
  run.nearT = 2;                          // 2 saniye boyunca çarpan aktif
  const factor = nearFactor();
  const bonus = (run.mult ? 2 : 1) * Math.round(100 * factor);
  run.dist += bonus;
  shake = Math.min(shake + 0.10, 1);      // yakın geçişten hafif bir titreme
  sfx.near();
  popups.push({ x: player.x + pSize/2, y: player.y - 6, vy: -46, life: 1.1, max: 1.1, text: '+' + bonus + ' ' + t('nearMiss') + ' x' + factor.toFixed(1), c: COLORS.neon });
}

/* ------------------------ SEVİYE / HIZLANMA ------------------------ */
function levelUp(n) {
  popups.push({ x: W/2, y: H*0.32, vy: -24, life: 1.3, max: 1.3, text: '!! ' + t('speedUp') + ' [' + (n+1) + '] !!', big: true });
  beep(500 + n*60, 0.10, 0.10, 'square');
  beep(750 + n*60, 0.12, 0.09, 'square', 0.07);
  shake = Math.min(shake + 0.35, 1);
}

/* ------------------------ SEKTÖR GEÇİŞİ ------------------------ */
function sectorBanner(idx) {
  const s = idx % LEVELS.length;
  const c = LEVELS[s].accent;
  popups.push({ x: W/2, y: H*0.30, vy: -8, life: 1.7, max: 1.7, text: t('sec' + (s+1)), big: true, c: c });
  popups.push({ x: W/2, y: H*0.30 + 34, vy: -8, life: 1.7, max: 1.7, text: t('tip' + (s+1)), big: false, c: c });
  beep(440, 0.09, 0.08, 'square');
  beep(554, 0.09, 0.08, 'square', 0.09);
  beep(659, 0.14, 0.10, 'square', 0.18);
  shake = Math.min(shake + 0.25, 1);
}

/* ------------------------ GÜNCELLEME ------------------------ */
function update(dt) {
  run.time += dt;

  /* skor: mesafe. Çarpanlar aktifken 2x / near-miss kombo çarpanı */
  run.dist += run.speed * dt * (run.mult ? 2 : 1) * (run.nearT > 0 ? nearFactor() : 1) * 0.018;

  /* zorluk eğrisi: her 100 puanda hız atlar, zamana bağlı hafif artış */
  const newLevel = Math.floor(run.dist / 100);
  if (newLevel > run.level) { run.level = newLevel; levelUp(newLevel); }

  /* sektör geçişi: her SECTOR_LEN puan sonunda yeni tema + daha sert parametreler */
  const newSector = Math.floor(run.dist / SECTOR_LEN);
  if (newSector > run.sector) {
    if (DEMO && newSector >= LEVELS.length) { demoComplete(); return; }  // demo bitti
    run.lastSector = run.sector;
    run.sector = newSector;
    applyTheme(run.sector);
    run.base = sectorBase(run.sector);
    run.max  = sectorMax(run.sector, run.base);
    run.ACC  = 2 + run.sector * 0.8;              // sektörler hızlandıkça hızlanma artar
    run.SECTOR_DEC = 1;                           // yeni sektöre kısa "nefes" arası
    run.banUntil = run.speed * 1.1;               // ~1.1s boyunca yeni engel üretme
    sectorBanner(run.sector);
    burst(player.x + pSize/2, player.y + pSize/2, theme.accent, 22);
  }
  if (run.SECTOR_DEC > 0) run.SECTOR_DEC -= dt * 0.8;
  if (run.SECTOR_DEC < 0) run.SECTOR_DEC = 0;
  if (run.banUntil > 0) run.banUntil -= run.speed * dt;

  run.speed = Math.min(run.max, run.base * (1 + run.level * 0.18) + run.time * run.ACC);
  run.speed *= (1 - 0.30 * run.SECTOR_DEC);       // sektör geçişinde kısa yavaşlama

  run.scroll += run.speed * dt * 0.35;
  if (run.scroll > 160) run.scroll -= 160;

  /* efekt sürelerini azalt */
  if (run.shieldT > 0) { run.shieldT -= dt; if (run.shieldT <= 0) run.shield = false; }
  if (run.multT   > 0) { run.multT   -= dt; if (run.multT   <= 0) run.mult   = false; }
  if (run.nearT   > 0) { run.nearT   -= dt; if (run.nearT   <= 0) run.nearT  = 0; }
  if (player.landT > 0) player.landT -= dt;

  /* hayalet iz */
  trail.push({ x: player.x, y: player.y });
  if (trail.length > 8) trail.shift();

  /* engel üretimi: seviye + tema yoğunluğu ile sıklaşır */
  run.nextObstacle -= run.speed * dt;
  if (run.nextObstacle <= 0 && run.banUntil <= 0) {
    spawnObstacle();
    run.nextObstacle = W * (Math.max(0.36, 0.52 - run.level * 0.02) / theme.density + Math.random() * 0.4);
  }
  /* güçlendirme üretimi (nadir -> sert oyun) */
  run.nextPower -= run.speed * dt;
  if (run.nextPower <= 0) {
    spawnPowerUp();
    run.nextPower = W * (2.6 + Math.random() * 1.4);
  }
  /* veri biti yayları üretimi (sık, düşük ve ulaşılabilir) */
  run.nextBits -= run.speed * dt;
  if (run.nextBits <= 0) {
    spawnBits();
    run.nextBits = W * (1.3 + Math.random() * 1.5);
  }

  /* engelleri ve güçlendirmeleri hareket ettir */
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= run.speed * dt;
    if (o.type === 'flyer') o.y = o.baseY + Math.sin(run.time * 3 + o.phase) * 22;  // dikey süzülme
    if (o.type === 'saw')   o.h = o.baseH + Math.sin(run.time * 2.6 + o.phase) * 7; // testere sallanması
    if (o.x + o.w < -20) obstacles.splice(i, 1);
  }
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.x -= run.speed * dt;
    p.t += dt;
    if (p.x + 20 < -20) powerups.splice(i, 1);
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.x -= run.speed * dt;
    b.t += dt;
    if (b.x + 16 < -20) bits.splice(i, 1);
  }

  /* mıknatıs: çarpan/güçlendirme ve veri bitleri yakındayken oyuncuya çekilir
     (çarpan erişilebilirliğini belirgin şekilde artırır) */
  const es0 = effSize();
  const cx0 = player.x + es0 / 2, cy0 = player.y + es0 / 2;
  const MR = 150;
  for (const p of powerups) {
    const dx = cx0 - p.x, dy = cy0 - p.y;
    const d = Math.hypot(dx, dy);
    if (d < MR && d > 1) {
      const pull = (1 - d / MR) * 950 * dt;
      p.x += dx / d * pull; p.y += dy / d * pull;
    }
  }
  for (const b of bits) {
    const dx = cx0 - b.x, dy = cy0 - b.y;
    const d = Math.hypot(dx, dy);
    if (d < MR && d > 1) {
      const pull = (1 - d / MR) * 950 * dt;
      b.x += dx / d * pull; b.y += dy / d * pull;
    }
  }

  /* oyuncu fiziği */
  if (!player.grounded) {
    player.vy += gravity * dt;                 // yerçekimi
  } else {
    player.vy = 0;
  }
  player.y += player.vy * dt;

  /* zemin / tavan çarpışması (eğilirken etkin boyut kullanılır) */
  const es = effSize();
  if (player.y + es >= groundY) {
    if (!player.grounded) player.landT = 0.3;  // iniş squash
    player.y = groundY - es;
    player.vy = 0;
    player.grounded = true; player.jumps = 0;
    player.coyote = 0.09;                      // kenar toleransı
  } else {
    if (player.grounded) player.coyote -= dt;
    player.grounded = false;
  }
  if (player.y < 0) { player.y = 0; player.vy = 0; }

  /* coyote + tampon: his olarak daha "gerçekçi" kontroller */
  if (player.coyote > 0) player.coyote -= dt;
  if (player.buffer > 0) {
    player.buffer -= dt;
    if (canGroundJump()) tryJump();            // zıplama gerçekleştir
  }

  /* çarpışma: engeller (AABB). Çukur yere basarken çarpar */
  const pw = es * 0.72, ph = es * 0.72;
  const px = player.x + (es - pw) / 2, py = player.y + (es - ph) / 2;
  const feet = player.y + es;
  for (const o of obstacles) {
    let hit;
    if (o.type === 'pit') {
      hit = (px < o.x + o.w && px + pw > o.x && feet >= groundY - 1);
    } else {
      hit = (px < o.x + o.w && px + pw > o.x && py < o.y + o.h && py + ph > o.y);
    }
    if (hit) {
      if (run.shield) {                        // kalkan çarpmayı emer
        run.shield = false; run.shieldT = 0;
        burst(px + pw/2, py + ph/2, COLORS.cyan, 18);
        shake = Math.min(shake + 0.35, 1);     // kalkan darbesi ekranı sarsar
        sfx.pickup();
        o.passed = true;
        obstacles.splice(obstacles.indexOf(o), 1);
      } else {
        gameOver();
      }
      break;
    }
  }
  if (state !== STATE.PLAY) return;

  /* NEAR MISS: engel geçildiğinde dikey açıklık küçükse bonus */
  for (const o of obstacles) {
    if (o.passed || o.x + o.w >= px) continue;
    o.passed = true;
    let clear = -1;
    if (o.type === 'ground') {
      clear = o.y - (py + ph);                 // üstünden atlandı
    } else if (o.type === 'laser') {
      clear = py - (o.y + o.h);                // altından geçildi
    } else {
      clear = Math.min(py + ph - o.y, o.y + o.h - py); // yakın kenar boşluğu
    }
    if (clear >= 0 && clear < es * 0.6) triggerNearMiss(o);
  }

  /* güçlendirme toplama */
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    const rr = 14;
    if (px < p.x + rr && px + pw > p.x - rr && py < p.y + rr && py + ph > p.y - rr) {
      powerups.splice(i, 1);
      shake = Math.min(shake + 0.08, 1);   // güçlendirme alırken hafif vuruş hissi
      if (p.type === 'shield') {
        run.shield = true; run.shieldT = 6;
        burst(p.x, p.y, COLORS.cyan, 14);
        popups.push({ x: p.x, y: p.y - 14, vy: -40, life: 0.9, max: 0.9, text: t('hudShield') + ' 6s', c: COLORS.cyan });
      } else {
        run.mult = true; run.multT = 8;
        burst(p.x, p.y, COLORS.amber, 14);
        popups.push({ x: p.x, y: p.y - 14, vy: -40, life: 0.9, max: 0.9, text: t('hudMult') + ' 8s', c: COLORS.amber });
      }
      sfx.pickup();
    }
  }

  /* veri biti toplama */
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    if (Math.abs(b.x - (player.x + es / 2)) < 22 && Math.abs(b.y - (player.y + es / 2)) < 22) {
      bits.splice(i, 1);
      const gain = Math.round(25 * (run.mult ? 2 : 1) * (run.nearT > 0 ? nearFactor() : 1));
      run.dist += gain;
      burst(b.x, b.y, COLORS.amber, 6);
      popups.push({ x: b.x, y: b.y - 10, vy: -42, life: 0.7, max: 0.7, text: '+' + gain, c: COLORS.amber });
      sfx.pickup();
    }
  }

  /* parçacıklar */
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life -= dt;
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vy += 400 * dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  /* popup yazıları */
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life -= dt; p.y += p.vy * dt;
    if (p.life <= 0) popups.splice(i, 1);
  }

  if (shake > 0) { shake -= dt * 4; if (shake < 0) shake = 0; }
  if (flash > 0) flash -= dt * 3;
}

/* ------------------------ ÜRETİCİLER ------------------------ */
function pickObstacleType() {
  const types = ['ground', 'laser', 'flyer', 'spike', 'saw', 'pit'];
  const w = theme.w;
  let total = 0;
  for (const k of types) total += w[k];
  let r = Math.random() * total;
  for (const k of types) {
    r -= w[k];
    if (r < 0) return k;
  }
  return 'ground';
}

function spawnObstacle() {
  const type = pickObstacleType();
  const lv = run.level;
  const w = Math.max(20, Math.round(H * 0.042));
  const pw = pSize;
  switch (type) {
    case 'ground': {
      /* zemin firewall: üzerinden atlanır */
      const h = maxObH * (0.3 + Math.random() * 0.7);
      obstacles.push({ type: 'ground', x: W + 30, y: groundY - h, w: w, h: h, passed: false });
      /* yüksek seviyede çift duvar (kombo) */
      if (lv >= 2 && Math.random() < Math.min(0.5, 0.15 + lv * 0.04)) {
        const h2 = maxObH * (0.3 + Math.random() * 0.5);
        obstacles.push({ type: 'ground', x: W + 30 + w + W * 0.16, y: groundY - h2, w: w, h: h2, passed: false });
      }
      break;
    }
    case 'laser': {
      /* tavan lazeri: dar aralık, altından geçilir */
      const gap = pw * theme.laserGap;
      obstacles.push({ type: 'laser', x: W + 30, y: 0, w: Math.round(H * 0.09), h: Math.max(40, groundY - gap), passed: false });
      if (theme.density > 1.15 && lv >= 3 && Math.random() < 0.3) {
        obstacles.push({ type: 'laser', x: W + 30 + W * 0.22, y: 0, w: Math.round(H * 0.09), h: Math.max(40, groundY - pw * theme.laserGap), passed: false });
      }
      break;
    }
    case 'flyer': {
      /* havada süzülen engel: tema boyutu + güçlü süzülme */
      const size = pw * theme.flyerSize;
      const baseY = groundY - pw * (1.4 + Math.random() * 1.4);
      obstacles.push({ type: 'flyer', x: W + 30, y: baseY, w: size, h: size, baseY: baseY, phase: Math.random() * 6.28, passed: false });
      break;
    }
    case 'spike': {
      /* zemin dikenleri: kısa ama kıskaç şerit, üzerinden atlanır */
      const n = 3 + Math.floor(Math.random() * 3);
      const h = pw * 0.45;
      obstacles.push({ type: 'spike', x: W + 30, y: groundY - h, w: n * pw * 0.55, h: h, n: n, passed: false });
      break;
    }
    case 'saw': {
      /* tavandan sarkan testere: altından geçilir, sallanır */
      const gap = pw * 1.6;
      const bladeW = pw * 1.1;
      obstacles.push({ type: 'saw', x: W + 30, y: 0, w: bladeW, h: Math.max(40, groundY - gap), baseH: Math.max(40, groundY - gap), phase: Math.random() * 6.28, passed: false });
      break;
    }
    case 'pit': {
      /* zemin çukuru: üzerinden atlanır, içine düşersen çöküş */
      const pw2 = pw * (2 + Math.random() * 2.5);
      obstacles.push({ type: 'pit', x: W + 30, y: groundY, w: pw2, h: H - groundY, passed: false });
      break;
    }
  }
}
function spawnPowerUp() {
  const x = W + 40;
  for (const o of obstacles) {
    if (o.type === 'pit' && o.x < x + 24 && o.x + o.w > x - 24) return;  // çukur üstünde üretme, bekle
  }
  const type = Math.random() < 0.6 ? 'mult' : 'shield';   // çarpanı daha sık ver
  const y = groundY - maxObH * (0.30 + Math.random() * 0.28); // tek zıplamayla rahatça ulaşılır
  powerups.push({ x: x, y: y, type: type, t: Math.random() * 3 });
}
function spawnBits() {
  const x0 = W + 40;
  for (const o of obstacles) {
    if (o.type === 'pit' && o.x < x0 + 260 && o.x + o.w > x0) return;  // çukur yakındaysa yayı ertele
  }
  const n = 3 + Math.floor(Math.random() * 3);
  const y = groundY - pSize * (0.8 + Math.random() * 0.8); // alçak, zıplayarak ulaşılır
  for (let i = 0; i < n; i++) {
    bits.push({ x: x0 + i * 42, y: y, t: Math.random() * 3, sz: 6 });
  }
}

/* ------------------------ SKİN MAĞAZASI ------------------------ */
function paintPreview(cv, s) {
  const f = cv.width / 96;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  c.save();
  c.scale(f, f);
  const bw = 36;
  const px = (96 - bw) / 2;
  const py = 48;
  drawPacketBody(c, px, py, bw, s.color);
  drawHat(c, px, py, bw, s.hat, s.color);
  c.restore();
}
function paintMenuPreview() {
  const cv = ui.previewCanvas;
  const s = currentSkinObj();
  const f = cv.width / 150;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  c.save();
  c.scale(f, f);
  const bw = 56;
  const px = (150 - bw) / 2;
  const py = 68;
  drawPacketBody(c, px, py, bw, s.color);
  drawHat(c, px, py, bw, s.hat, s.color);
  c.restore();
}
function skinCard(s, owned) {
  const active = currentSkin === s.key;
  const isOwned = owned.indexOf(s.key) !== -1;
  const el = document.createElement('button');
  el.className = 'skin-card' + (active ? ' active' : '');
  const cv = document.createElement('canvas');
  cv.width = 192; cv.height = 208;
  paintPreview(cv, s);
  const name = document.createElement('div');
  name.className = 'sname'; name.textContent = skinName(s);
  const stat = document.createElement('div');
  stat.className = 'sstat';
  stat.textContent = active ? t('shopEquipped')
                   : isOwned ? t('shopSelect')
                   : t('shopLocked') + ' ' + s.cost + 'KB';
  el.appendChild(cv); el.appendChild(name); el.appendChild(stat);
  el.addEventListener('click', () => {
    audio();
    if (isOwned) {
      selectSkin(s.key);
    } else if (totalKB >= s.cost) {
      totalKB -= s.cost;
      addOwned(s.key);
      selectSkin(s.key);
      saveStr(KEYS.total, String(totalKB));
      updateMenuStats();
    }
    buildShop();
  });
  return el;
}
function buildShop() {
  const grid = ui.shopGrid;
  grid.innerHTML = '';
  const owned = ownedSkins();
  for (const s of SKINS) {
    if (shopFilter === 'hats' && s.hat === 'none') continue;
    grid.appendChild(skinCard(s, owned));
  }
  ui.shopBalance.textContent = t('shopBalance') + ': ' + totalKB + ' KB';
}
function selectSkin(key) {
  currentSkin = key;
  saveStr(KEYS.skin, key);
  updateMenuStats();
}

/* ------------------------ ÇİZİM ------------------------ */
function drawGlow(color, blur, fn) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  fn();
  ctx.restore();
}

function drawBackground() {
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, W, H);

  /* kaydırılan dikey grid (paralaks) - sektör rengi */
  drawGlow(theme.accent, 4, () => {
    ctx.strokeStyle = alphaColor(theme.accent, 0.10);
    ctx.lineWidth = 1;
    const step = 160;
    const off = run.scroll % step;
    for (let x = -step + off; x < W + step; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, groundY); ctx.stroke();
    }
    ctx.strokeStyle = alphaColor(theme.accent, 0.06);
    for (let y = H * 0.2; y < groundY; y += H * 0.18) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  });
}

function drawGround() {
  drawGlow(theme.accent, 12, () => {
    ctx.fillStyle = alphaColor(theme.accent, 0.05);
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = theme.accent;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.fillStyle = alphaColor(theme.accent, 0.25);
    const step = 24;
    const off = run.scroll % (step * 2);
    for (let x = -step + off; x < W; x += step * 2) {
      ctx.fillRect(x, groundY + 12, 8, 3);
    }
  });
}

/* Oyuncu gövdesi: veri paketi (kare + X + çekirdek) */
function drawPacketBody(c, px, py, s, col) {
  c.save();
  c.shadowColor = col; c.shadowBlur = 14;
  c.fillStyle = 'rgba(4,10,8,0.95)';
  c.strokeStyle = col;
  c.lineWidth = 2;
  c.fillRect(px, py, s, s);
  c.strokeRect(px, py, s, s);
  c.beginPath();
  c.moveTo(px, py);        c.lineTo(px + s, py + s);
  c.moveTo(px + s, py);    c.lineTo(px, py + s);
  c.stroke();
  c.shadowBlur = 10;
  c.fillStyle = col;
  c.fillRect(px + s*0.38, py + s*0.38, s*0.24, s*0.24);
  c.restore();
}

/* Skín şapkaları: procedürel küçük çizimler */
function drawHat(c, px, py, s, hat, col) {
  if (!hat || hat === 'none') return;
  const cx = px + s / 2;
  c.save();
  c.lineJoin = 'round';
  switch (hat) {
    case 'beanie': {
      c.fillStyle = col;
      c.beginPath();
      c.arc(cx, py - s*0.10, s*0.42, Math.PI, 0);
      c.closePath(); c.fill();
      c.fillRect(px - s*0.10, py - s*0.18, s + s*0.20, s*0.14);
      c.strokeStyle = 'rgba(0,0,0,0.4)'; c.lineWidth = 1;
      for (let i = -3; i <= 3; i++) {
        c.beginPath(); c.moveTo(cx - s*0.34, py - s*0.15); c.lineTo(cx + s*0.34, py - s*0.15); c.stroke();
      }
      break;
    }
    case 'cap': {
      c.fillStyle = col;
      c.beginPath(); c.arc(cx, py - s*0.06, s*0.40, Math.PI, 0); c.closePath(); c.fill();
      c.fillRect(cx, py - s*0.10, s*0.34, s*0.12);
      break;
    }
    case 'headset': {
      c.strokeStyle = col; c.lineWidth = Math.max(2, s*0.09); c.lineCap = 'round';
      c.beginPath(); c.arc(cx, py, s*0.46, Math.PI, 0); c.stroke();
      c.fillStyle = col;
      c.fillRect(px - s*0.46, py - s*0.34, s*0.16, s*0.34);
      c.fillRect(px + s*0.30, py - s*0.34, s*0.16, s*0.34);
      c.fillStyle = 'rgba(0,0,0,0.5)';
      c.fillRect(px - s*0.42, py - s*0.22, s*0.08, s*0.16);
      c.fillRect(px + s*0.34, py - s*0.22, s*0.08, s*0.16);
      break;
    }
    case 'antenna': {
      c.strokeStyle = col; c.lineWidth = Math.max(2, s*0.05);
      c.beginPath(); c.moveTo(cx, py); c.lineTo(cx, py - s*0.62); c.stroke();
      c.shadowColor = col; c.shadowBlur = 12;
      c.fillStyle = col;
      c.beginPath(); c.arc(cx, py - s*0.66, s*0.08, 0, Math.PI*2); c.fill();
      break;
    }
    case 'crown': {
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(px - s*0.06, py);
      c.lineTo(px - s*0.06, py - s*0.30);
      c.lineTo(px + s*0.16, py - s*0.18);
      c.lineTo(cx, py - s*0.38);
      c.lineTo(px + s*0.84, py - s*0.18);
      c.lineTo(px + s*1.06, py - s*0.30);
      c.lineTo(px + s*1.06, py);
      c.closePath(); c.fill();
      c.fillStyle = 'rgba(0,0,0,0.4)';
      c.fillRect(px - s*0.06, py - s*0.10, s*1.12, s*0.10);
      c.fillStyle = '#fff';
      c.fillRect(cx - s*0.06, py - s*0.34, s*0.05, s*0.05);
      c.fillRect(px + s*0.22, py - s*0.16, s*0.05, s*0.05);
      break;
    }
    case 'wizard': {
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(px - s*0.04, py);
      c.lineTo(cx, py - s*0.80);
      c.lineTo(px + s*1.04, py);
      c.closePath(); c.fill();
      c.fillRect(px - s*0.18, py - s*0.10, s + s*0.36, s*0.12);
      c.fillStyle = 'rgba(0,0,0,0.35)';
      c.fillRect(cx - s*0.28, py - s*0.40, s*0.56, s*0.10);
      c.fillStyle = '#fff';
      c.fillRect(cx - s*0.10, py - s*0.60, s*0.06, s*0.06);
      c.fillRect(cx - s*0.16, py - s*0.20, s*0.05, s*0.05);
      break;
    }
    case 'cowboy': {
      c.fillStyle = col;
      c.fillRect(px - s*0.22, py - s*0.26, s + s*0.44, s*0.12);
      c.beginPath(); c.arc(cx, py - s*0.14, s*0.30, Math.PI, 0); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(cx - s*0.14, py - s*0.30); c.quadraticCurveTo(cx, py - s*0.34, cx + s*0.14, py - s*0.30); c.stroke();
      break;
    }
  }
  c.restore();
}

function drawPlayer() {
  const col = skinColor();
  const hat = skinHat();
  const s = effSize();
  const px = player.x, py = player.y;

  /* kalkan halkası */
  if (run.shield) {
    drawGlow(COLORS.cyan, 18, () => {
      ctx.strokeStyle = COLORS.cyan;
      ctx.lineWidth = 3;
      const pulse = 1 + Math.sin(run.time * 6) * 0.05;
      ctx.beginPath();
      ctx.arc(px + s/2, py + s/2, s * 0.82 * pulse, 0, Math.PI * 2);
      ctx.stroke();
    });
  }

  /* squash & stretch: zıplarken uzar, inerken basılır */
  ctx.save();
  let sx = 1, sy = 1;
  if (!player.grounded) {
    const f = clamp(-player.vy / (jumpV * 0.9), -0.22, 0.30);
    sy = 1 + Math.max(0, f); sx = 1 - Math.max(0, f);
  } else if (player.landT > 0) {
    sy = 1 - 0.12 * player.landT; sx = 1 + 0.12 * player.landT;
  }
  ctx.translate(px + s/2, py + s/2);
  ctx.scale(sx, sy);
  ctx.translate(-(px + s/2), -(py + s/2));

  drawPacketBody(ctx, px, py, s, col);
  drawHat(ctx, px, py, s, hat, col);
  ctx.restore();
}

function drawTrail() {
  const es = effSize();
  for (let i = 0; i < trail.length; i++) {
    const tr = trail[i];
    ctx.globalAlpha = ((i + 1) / trail.length) * 0.22;
    ctx.fillStyle = skinColor();
    ctx.fillRect(tr.x, tr.y, es, es);
  }
  ctx.globalAlpha = 1;
}

function drawObstacle(o) {
  const ac = theme.accent;
  const dark = alphaColor(ac, 0.14);
  const deep = alphaColor(ac, 0.05);
  ctx.save();
  if (o.type === 'ground') {
    drawGlow(ac, 14, () => {
      ctx.fillStyle = 'rgba(4,6,8,0.95)';
      ctx.strokeStyle = ac;
      ctx.lineWidth = 2;
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = alphaColor(ac, 0.6);
      for (let yy = o.y + 10; yy < o.y + o.h; yy += 10) {
        ctx.beginPath(); ctx.moveTo(o.x + 1, yy); ctx.lineTo(o.x + o.w - 1, yy); ctx.stroke();
      }
      ctx.strokeStyle = ac;
      ctx.lineWidth = 3;
      const step = 12;
      for (let yy = o.y + 2; yy < o.y + o.h; yy += step) {
        ctx.beginPath();
        ctx.moveTo(o.x + 4, yy); ctx.lineTo(o.x + o.w - 4, yy + 4);
        ctx.stroke();
      }
    });
  } else if (o.type === 'laser') {
    /* tavandan sarkan lazer bariyeri */
    drawGlow(ac, 14, () => {
      ctx.fillStyle = 'rgba(4,6,8,0.9)';
      ctx.strokeStyle = ac;
      ctx.lineWidth = 2;
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = ac;
      ctx.lineWidth = 2;
      for (let yy = 8; yy < o.h; yy += 14) {
        ctx.beginPath(); ctx.moveTo(o.x + 2, yy); ctx.lineTo(o.x + o.w - 2, yy); ctx.stroke();
      }
      const tipY = o.y + o.h;
      ctx.fillStyle = ac;
      ctx.beginPath(); ctx.arc(o.x + o.w/2, tipY, 5 + Math.sin(run.time * 10) * 1.5, 0, Math.PI * 2); ctx.fill();
    });
  } else if (o.type === 'flyer') {
    /* havada süzülen engel: dönen sektör kristali */
    drawGlow(ac, 14, () => {
      ctx.translate(o.x + o.w/2, o.y + o.h/2);
      ctx.rotate(run.time * 2 + o.phase);
      ctx.fillStyle = 'rgba(4,6,8,0.9)';
      ctx.strokeStyle = ac;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -o.h/2); ctx.lineTo(o.w/2, 0); ctx.lineTo(0, o.h/2); ctx.lineTo(-o.w/2, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.rotate(-(run.time * 2 + o.phase));
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
    });
  } else if (o.type === 'spike') {
    /* zemin dikenleri: sivri uçlu üçgenler */
    drawGlow(ac, 14, () => {
      ctx.fillStyle = deep;
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = ac;
      ctx.lineWidth = 2;
      const sw = o.w / o.n;
      for (let i = 0; i < o.n; i++) {
        const sx = o.x + i * sw;
        ctx.beginPath();
        ctx.moveTo(sx, groundY);
        ctx.lineTo(sx + sw/2, o.y);
        ctx.lineTo(sx + sw, groundY);
        ctx.closePath();
        ctx.fillStyle = dark;
        ctx.fill();
        ctx.stroke();
      }
    });
  } else if (o.type === 'saw') {
    /* tavandan zincirle sarkan dönen testere */
    const cx = o.x + o.w/2;
    const bladeY = o.y + o.h;
    const r = o.w/2;
    drawGlow(ac, 14, () => {
      ctx.strokeStyle = ac;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let y = 6; y < bladeY - r; y += 8) {
        ctx.moveTo(cx - 2, y); ctx.lineTo(cx + 2, y);
      }
      ctx.stroke();
      ctx.translate(cx, bladeY);
      ctx.rotate(run.time * 6 + o.phase);
      ctx.fillStyle = dark;
      ctx.strokeStyle = ac;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        ctx.lineTo(Math.cos(a + 0.35) * r * 0.55, Math.sin(a + 0.35) * r * 0.55);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
  } else if (o.type === 'pit') {
    /* zemin çukuru: içi boş, düşüş uyarısı */
    drawGlow(ac, 14, () => {
      ctx.fillStyle = 'rgba(2,2,2,0.96)';
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = ac;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(o.x, groundY); ctx.lineTo(o.x + o.w, groundY); ctx.stroke();
      ctx.strokeStyle = alphaColor(ac, 0.7);
      ctx.lineWidth = 2;
      const step = 14;
      for (let x = o.x + 4; x < o.x + o.w - 4; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, groundY + 8); ctx.lineTo(x - 6, groundY + 20);
        ctx.stroke();
      }
      ctx.fillStyle = alphaColor(ac, 0.5);
      for (let y = groundY + 24; y < H; y += 22) {
        ctx.fillRect(o.x + 4, y, o.w - 8, 2);
      }
    });
  }
  ctx.restore();
}

function drawPowerUp(p) {
  const r = 11 + Math.sin(p.t * 6) * 1.5;      // nabız
  ctx.save();
  drawGlow(p.type === 'shield' ? COLORS.cyan : COLORS.amber, 14, () => {
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = p.type === 'shield' ? 'rgba(0,20,30,0.95)' : 'rgba(30,16,0,0.95)';
    ctx.strokeStyle = p.type === 'shield' ? COLORS.cyan : COLORS.amber;
    ctx.lineWidth = 2;
    ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.strokeRect(-r, -r, r * 2, r * 2);
    ctx.rotate(-Math.PI / 4);
    ctx.font = 'bold 11px "Courier New",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = p.type === 'shield' ? COLORS.cyan : COLORS.amber;
    ctx.fillText(p.type === 'shield' ? 'S' : 'x2', 0, 1);
  });
  ctx.restore();
}

function drawBit(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(Math.PI / 4 + Math.sin(b.t * 4) * 0.2);
  ctx.fillStyle = COLORS.amber;
  ctx.shadowColor = COLORS.amber;
  ctx.shadowBlur = 8;
  ctx.fillRect(-b.sz, -b.sz, b.sz * 2, b.sz * 2);
  ctx.restore();
}

function drawParticles() {
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.max);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size/2, pt.y - pt.size/2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  for (const p of popups) {
    const a = Math.max(0, p.life / p.max);
    const col = p.c || (p.big ? COLORS.red : COLORS.neon);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = p.big ? 'bold 26px "Courier New",monospace' : 'bold 16px "Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = col;
    ctx.shadowBlur = 16;
    ctx.fillStyle = col;
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }
}

function drawMuteIcon() {
  const x = W - 20, y = 78;
  ctx.save();
  ctx.textAlign = 'right';
  ctx.font = '11px "Courier New",monospace';
  ctx.fillStyle = COLORS.neon; ctx.shadowColor = COLORS.neon; ctx.shadowBlur = 6;
  ctx.fillText(muted ? '[MUTE]' : '[SND]', x, y - 16);
  ctx.fillStyle = COLORS.neon;
  ctx.fillRect(x - 34, y - 8, 8, 11);
  ctx.beginPath(); ctx.moveTo(x - 26, y - 8); ctx.lineTo(x - 15, y - 14); ctx.lineTo(x - 15, y + 7); ctx.lineTo(x - 26, y - 8); ctx.fill();
  ctx.strokeStyle = COLORS.neon; ctx.lineWidth = 1.5;
  if (!muted) {
    ctx.beginPath(); ctx.arc(x - 13, y - 1, 4, -0.6, 0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(x - 13, y - 1, 7, -0.6, 0.6); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x - 16, y - 9); ctx.lineTo(x - 4, y + 7);
    ctx.moveTo(x - 4, y - 9); ctx.lineTo(x - 16, y + 7);
    ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.font = 'bold 15px "Courier New",monospace';
  ctx.textBaseline = 'top';

  /* sol üst: skor */
  ctx.fillStyle = COLORS.neon;
  ctx.shadowColor = COLORS.neon; ctx.shadowBlur = 8;
  ctx.fillText(t('hudProcessed') + ': ' + Math.floor(run.dist) + ' KB', 18, 18);

  /* seviye */
  ctx.fillStyle = COLORS.amber;
  ctx.shadowColor = COLORS.amber;
  ctx.fillText(t('hudLevel') + ': ' + run.level, 18, 42);

  /* sektör + ilerleme çubuğu */
  ctx.fillStyle = theme.accent;
  ctx.shadowColor = theme.accent;
  ctx.fillText(t('hudSector') + ': ' + ((run.sector % LEVELS.length) + 1), 18, 66);
  const frac = (run.dist % SECTOR_LEN) / SECTOR_LEN;
  ctx.shadowBlur = 0;
  ctx.fillStyle = alphaColor(theme.accent, 0.18);
  ctx.fillRect(18, 82, 120, 5);
  ctx.fillStyle = theme.accent;
  ctx.fillRect(18, 82, 120 * frac, 5);

  /* sağ üst: hız */
  ctx.textAlign = 'right';
  ctx.fillStyle = COLORS.cyan;
  ctx.shadowColor = COLORS.cyan;
  ctx.shadowBlur = 8;
  ctx.fillText(t('hudSpeed') + ': ' + (run.speed / run.base).toFixed(1) + 'x', W - 18, 18);
  ctx.textAlign = 'left';

  /* aktif efektler */
  const fx = [];
  if (run.shield) fx.push({ t: t('hudShield'), s: run.shieldT.toFixed(0) + 's', c: COLORS.cyan });
  if (run.mult)   fx.push({ t: t('hudMult'),   s: run.multT.toFixed(0) + 's',   c: COLORS.amber });
  if (run.nearT > 0) fx.push({ t: t('hudNear') + ' x' + nearFactor().toFixed(1), s: run.nearT.toFixed(0) + 's', c: COLORS.neon });
  let yy = 100;
  for (const f of fx) {
    ctx.fillStyle = f.c;
    ctx.shadowColor = f.c;
    ctx.fillText(f.t + ' [' + f.s + ']', 18, yy);
    yy += 24;
  }

  /* demo etiketi (oyun sırasında üst ortada) */
  if (DEMO) {
    ctx.textAlign = 'center';
    ctx.fillStyle = COLORS.red;
    ctx.shadowColor = COLORS.red;
    ctx.shadowBlur = 8;
    ctx.fillText('[ DEMO ]', W / 2, 18);
    ctx.textAlign = 'left';
  }
  ctx.restore();

  drawMuteIcon();
}

function drawFlash() {
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,51,102,' + Math.min(0.5, flash) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake*12, (Math.random()-0.5)*shake*12);

  drawBackground();
  drawGround();
  for (const p of powerups) drawPowerUp(p);
  for (const b of bits) drawBit(b);
  for (const o of obstacles) drawObstacle(o);
  drawTrail();
  drawPlayer();
  drawParticles();
  drawPopups();
  drawFlash();
  if (state === STATE.PLAY || state === STATE.PAUSE) drawHUD();

  ctx.restore();
}

/* ------------------------ OYUN DÖNGÜSÜ ------------------------ */
let rafId = null;
/* Tek bir aktif döngü garantisi: eski RAF isteği iptal edilir,
   böylece resume/pause/menu geçişlerinde döngü asla çiftlenmez. */
function startLoop() {
  if (rafId) cancelAnimationFrame(rafId);
  lastT = performance.now();
  rafId = requestAnimationFrame(loop);
}
function loop(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt < 0) dt = 0;                    // nadir zaman damgası sapmalarını yok say
  if (dt > 0.05) dt = 0.05;              // sekme gizliyken dev sıçramayı engelle

  if (state === STATE.MENU || state === STATE.OVER) {
    if (shake > 0) {                     // çökme sonrası sarsıntı yavaşça diner
      shake -= dt * 4;
      if (shake < 0) shake = 0;
      render();
      rafId = requestAnimationFrame(loop);
      return;
    }
    render();
    return;
  }

  if (state === STATE.PLAY) update(dt);
  render();
  rafId = requestAnimationFrame(loop);
}

/* ------------------------ GİRİŞ / KONTROLLER ------------------------ */
function pressAction() {
  if (!ui.settings.hidden) { return; }
  if (state === STATE.MENU)   { startGame(); return; }
  if (state === STATE.PLAY)   { jump(); return; }
  if (state === STATE.PAUSE)  { resume(); return; }
}

function togglePause() {
  if (state === STATE.PLAY)  { state = STATE.PAUSE; showScreen('pause'); }
  else if (state === STATE.PAUSE) { resume(); }
}
function resume() {
  state = STATE.PLAY;
  ui.menu.hidden = true; ui.pause.hidden = true; ui.over.hidden = true; ui.demo.hidden = true; ui.shop.hidden = true; ui.settings.hidden = true;
  ui.btnSettings.hidden = true;
  updateDuckBtn();
  startLoop();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    audio();
    pressAction();
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    if (!ui.settings.hidden) { e.preventDefault(); closeSettings(); return; }
    if (state === STATE.PLAY || state === STATE.PAUSE) { e.preventDefault(); togglePause(); }
  } else if (e.code === 'KeyM') {
    toggleMute();
  } else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    if (state === STATE.PLAY) setDuck(true);
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') setDuck(false);
});

/* mobil / dokunmatik. Sağ üstteki ses ikonuna dokunmak sessize alır */
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audio();
  const mx = e.clientX, my = e.clientY;
  if ((state === STATE.PLAY || state === STATE.PAUSE) && mx > W - 70 && my > 55 && my < 95) {
    toggleMute();
    return;
  }
  pressAction();
}, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* mobil eğil butonu: basılı tut = küçül, bırak = eski boyut */
if (ui.btnDuck) {
  ui.btnDuck.addEventListener('pointerdown', (e) => { e.preventDefault(); audio(); setDuck(true); });
  ui.btnDuck.addEventListener('pointerup',   (e) => { e.preventDefault(); setDuck(false); });
  ui.btnDuck.addEventListener('pointercancel', () => setDuck(false));
  ui.btnDuck.addEventListener('pointerleave',  () => setDuck(false));
  ui.btnDuck.addEventListener('contextmenu',   (e) => e.preventDefault());
}

/* düğmeler */
document.getElementById('btn-start').addEventListener('click', () => { audio(); startGame(); });
document.getElementById('btn-shop').addEventListener('click', () => { audio(); showShop(); });
document.getElementById('btn-shop-back').addEventListener('click', () => goMenu());
document.getElementById('btn-retry').addEventListener('click', () => { audio(); startGame(); });
document.getElementById('btn-resume').addEventListener('click', resume);
document.getElementById('btn-quit').addEventListener('click', () => goMenu());
document.getElementById('btn-menu').addEventListener('click', () => goMenu());
document.getElementById('btn-demo-retry').addEventListener('click', () => { audio(); startGame(); });
document.getElementById('btn-demo-menu').addEventListener('click', () => goMenu());
ui.btnSettings.addEventListener('click', () => { audio(); showSettings(); });
ui.btnSetMute.addEventListener('click', () => { audio(); toggleMute(); });
ui.btnSetGlow.addEventListener('click', () => { audio(); toggleGlow(); });
document.getElementById('btn-settings-back').addEventListener('click', closeSettings);

/* dil butonları */
document.querySelectorAll('.lang-opt').forEach(b => {
  b.addEventListener('click', () => setLang(b.getAttribute('data-lang')));
});

/* mağaza filtre çipleri */
document.querySelectorAll('.chip').forEach(ch => {
  ch.addEventListener('click', () => {
    audio();
    shopFilter = ch.getAttribute('data-filter');
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === ch));
    buildShop();
  });
});

/* ses: herhangi bir dokunuşta WebAudio'yu başlat */
document.addEventListener('pointerdown', () => audio());

/* sekme kaybolunca otomatik duraklat */
window.addEventListener('blur', () => { if (state === STATE.PLAY) togglePause(); });

/* boyutlandırma */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ------------------------ BAŞLAT ------------------------ */
resize();
applyLang();
resetRun();
showScreen('menu');
startLoop();
</script>
